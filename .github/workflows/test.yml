name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Unit tests
        run: bun test api.test.js subscription_api.test.ts

      - name: E2E tests
        run: bun test api.e2e.test.js subscription_api.e2e.test.ts
